  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCL8C6_q3CtPkg33xXA4SUxmDOSnW-dOH4",
      authDomain: "knowing-v1.firebaseapp.com",
      projectId: "knowing-v1",
      storageBucket: "knowing-v1.firebasestorage.app",
      messagingSenderId: "349439956510",
      appId: "1:349439956510:web:158dcfc3b5aad153f2c00f",
      measurementId: "G-B2DPWC59MJ"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const firestore = getFirestore(app);
    const analytics = getAnalytics(app);
    const googleProvider = new GoogleAuthProvider();

    // Make Firebase available globally
    window.firebase = {
      app,
      auth,
      firestore,
      analytics,
      googleProvider
    };

    // Function to trigger Google Sign-In
    window.signInWithGoogle = async function() {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        console.log('Successfully signed in:', result.user);
        const idToken = await result.user.getIdToken();
        
        // Use the proper method to communicate with Flutter
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('onGoogleSignInSuccess', idToken);
        } else if (window.flutterWebRenderer) {
          window.flutterWebRenderer.callMethod('onGoogleSignInSuccess', [idToken]);
        } else {
          // Use the proper method to communicate with Flutter web
          window.flutterWebRenderer = {
            callMethod: function(methodName, args) {
              if (methodName === 'onGoogleSignInSuccess') {
                window.dispatchEvent(new CustomEvent('googleSignInSuccess', { detail: args[0] }));
              } else if (methodName === 'onGoogleSignInError') {
                window.dispatchEvent(new CustomEvent('googleSignInError', { detail: args[0] }));
              }
            }
          };
          window.flutterWebRenderer.callMethod('onGoogleSignInSuccess', [idToken]);
        }
      } catch (error) {
        console.error('Error signing in:', error);
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('onGoogleSignInError', error.message);
        } else if (window.flutterWebRenderer) {
          window.flutterWebRenderer.callMethod('onGoogleSignInError', [error.message]);
        } else {
          window.dispatchEvent(new CustomEvent('googleSignInError', { detail: error.message }));
        }
      }
    };
  </script>
